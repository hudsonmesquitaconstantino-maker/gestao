<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Multas da Frota</title>
<meta name="app" content="guimas-multas">
<meta name="theme-color" content="#F2F3F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Multas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" type="image/png" href="icone-192.png">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F3F5;--card:#fff;--ink:#16181D;--mut:#6B7280;--line:#E3E5E9;--soft:#F6F7F9;
  --amber:#C77A16;--amber-s:#FBF1E3;--green:#2E7D5B;--green-s:#E6F2EC;
  --red:#B42318;--red-s:#FDECEA;--blue:#1E4BA0;
  --num:'Barlow Condensed',-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) calc(90px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}

/* topo */
header{padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:30;background:rgba(242,243,245,.88);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line)}
.hd{max-width:980px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));display:flex;align-items:center;gap:8px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font:700 19px var(--num);flex:none}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.brand p{margin:1px 0 0;color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#A0A6B0;margin-right:5px;vertical-align:1px}
.dot.ok{background:var(--green)}.dot.env{background:var(--amber)}.dot.err{background:var(--red)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 13px;font-weight:600;font-size:14px;transition:transform .2s var(--ease),background .2s,border-color .2s;white-space:nowrap}
.btn:hover{border-color:#cdd1d8}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#fff}
.btn.pri:hover{background:#B56E12}
.btn.grn{background:var(--green);border-color:var(--green);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--soft)}
.btn.danger{color:var(--red)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(16,24,40,.14);padding:6px;min-width:250px;display:none;z-index:40}
.menu.on{display:block;animation:pop .22s var(--ease)}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 11px;border-radius:8px;font-size:14px}
.menu button:hover{background:var(--soft)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}

/* números do topo */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0 10px}
.st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left}
.st .k{font-size:12px;color:var(--mut);font-weight:600}
.st .n{font-family:var(--num);font-size:30px;font-weight:700;line-height:1.05;margin-top:4px}
.st .d{font-size:12px;color:var(--mut);margin-top:2px}
button.st{cursor:pointer;transition:transform .2s var(--ease)}
button.st:active{transform:scale(.97)}
.st.red .n{color:var(--red)} .st.amb .n{color:var(--amber)} .st.grn .n{color:var(--green)}
@media(max-width:720px){.stats{grid-template-columns:1fr 1fr}.st .n{font-size:26px}}

.aviso{display:flex;align-items:center;gap:10px;background:var(--amber-s);border:1px solid #F1D8B3;color:#7A4B0C;border-radius:12px;padding:9px 12px;font-size:13.5px;margin-bottom:10px}
.aviso span{flex:1}
.aviso.red{background:var(--red-s);border-color:#F6C9C3;color:var(--red)}

.consulta{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.consulta .t{flex:1;min-width:210px}
.consulta .t b{font-size:14.5px}
.consulta .t small{color:var(--mut);font-size:12.5px;display:block}
.bar{height:6px;background:#ECEEF1;border-radius:99px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .5s var(--ease)}

.tools{display:flex;gap:8px;margin:12px 0 8px;flex-wrap:wrap}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 12px}
.search input{border:0;outline:0;background:transparent;width:100%;padding:9px 0}
.search:focus-within{border-color:var(--amber);box-shadow:0 0 0 3px rgba(199,122,22,.15)}
select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;font-weight:600;font-size:14px}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fchip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--mut);transition:all .2s var(--ease)}
.fchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* cartão do carro */
.car{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden;scroll-margin-top:84px;transition:box-shadow .3s var(--ease),border-color .3s}
.car.open{box-shadow:0 10px 30px rgba(16,24,40,.08);border-color:#D6D9DF}
.car.ok{box-shadow:inset 4px 0 0 var(--green)}
.car.ok.open{box-shadow:inset 4px 0 0 var(--green),0 10px 30px rgba(16,24,40,.08)}
.head{display:grid;grid-template-columns:auto minmax(0,1fr) auto 16px;gap:12px;align-items:center;padding:12px 14px 10px;cursor:pointer;user-select:none}
.plate{width:92px;border:1.5px solid #1b1d22;border-radius:6px;overflow:hidden;background:#fff;text-align:center}
.plate i{display:block;background:var(--blue);color:#fff;font:700 7px/10px -apple-system,'Segoe UI',sans-serif;letter-spacing:.22em;font-style:normal}
.plate b{display:block;font-family:var(--num);font-size:15.5px;font-weight:700;letter-spacing:.06em;padding:1px 2px 2px;white-space:nowrap}
.nm{font-weight:650;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm .bold{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;color:var(--mut);border:1px solid var(--line);border-radius:4px;padding:0 4px;vertical-align:2px}
.sub{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.tg{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--soft);color:var(--mut)}
.tg.hudson{background:var(--amber-s);color:var(--amber)}
.tg.ok{background:var(--green-s);color:var(--green)}
.tg.fin{background:#E8EEF9;color:var(--blue)}
.tg.mot{background:var(--ink);color:#fff}
.tg.par{background:#ECEDEF;color:#5B616B}
.nums{text-align:right;min-width:80px}
.cnt{white-space:nowrap}
.cnt b{font-family:var(--num);font-size:25px;font-weight:700;line-height:1}
.cnt span{font-size:12px;color:var(--mut);margin-left:4px}
.cnt.has b{color:var(--red)}
.cnt.zero b{color:var(--green)}
.val{font-family:var(--num);font-size:16.5px;font-weight:600;white-space:nowrap}
.miss{font-size:11px;color:var(--amber);font-weight:700;white-space:nowrap}
.chev{color:#A0A6B0;font-size:22px;line-height:1;transition:transform .35s var(--ease);text-align:center}
.car.open .chev{transform:rotate(90deg)}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 12px;align-items:center}
.cp{border:1px dashed #CDD1D8;background:var(--soft);border-radius:8px;padding:4px 9px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;transition:all .2s var(--ease)}
.cp small{color:var(--mut);font-weight:600;margin-right:5px;font-size:11px}
.cp:after{content:'⧉';color:#9AA0AA;margin-left:6px}
.cp:hover{border-color:var(--amber);background:var(--amber-s)}
.cp:active{transform:scale(.96)}
.conf{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 11px;font-size:13px;font-weight:700;color:var(--mut);transition:all .2s var(--ease)}
.conf.on{background:var(--green-s);color:var(--green);border-color:#BFE0CF}
.conf:active{transform:scale(.96)}
.wa{margin-left:auto;border:1px solid #BFE0CF;background:var(--green-s);color:var(--green);border-radius:8px;padding:4px 11px;font-size:13px;font-weight:700;transition:all .2s var(--ease)}
.wa.on{background:#fff;color:var(--mut);border-color:var(--line)}
.wa:active{transform:scale(.96)}
.wa + .conf{margin-left:0}
.cvprog{margin:8px 0 6px;font-size:13px}
.hl .pl{font-family:var(--num);font-weight:700;font-size:15px;border:1px solid #1b1d22;border-radius:4px;padding:0 5px;margin-right:4px}
.hl li.feito{opacity:.6}

.body{border-top:1px dashed var(--line);padding:12px 14px 14px;background:#FCFCFD}
.body.anim{animation:open .3s var(--ease)}
.mi input::placeholder{color:#C3C7CE;font-weight:500}
@keyframes open{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px;font-size:12px;color:var(--mut)}
.chip{border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 8px;font-size:12px;font-weight:600;color:var(--ink)}
.chip b{font-family:var(--num);font-size:14px;margin-left:3px}
.chip:hover{border-color:var(--amber)}
.fine{display:grid;grid-template-columns:100px 132px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #EEF0F3}
.fine:last-child{border-bottom:0}
.fd{font-family:var(--num);font-size:18px;font-weight:600;letter-spacing:.02em}
.mi{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 8px;min-width:0}
.mi span{color:var(--mut);font-size:13px;margin-right:4px}
.mi input{border:0;outline:0;width:100%;min-width:0;padding:7px 0;background:transparent;font-variant-numeric:tabular-nums;font-weight:600}
.mi.vazio{border-color:#EFCF9F;background:#FFFBF4}
.obs{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;min-width:0;width:100%;font-size:14px}
.mi:focus-within,.obs:focus,.f input:focus,.f select:focus,textarea:focus,input[type=date]:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(199,122,22,.15)}
.fa{display:flex;gap:4px}
.x{color:var(--mut)}
.btn.obr{color:var(--mut);padding:5px 8px}
.btn.obr.on{background:var(--ink);border-color:var(--ink);color:#fff}
.docbox{border:1px solid #F1D8B3;background:#FFFBF4;border-radius:12px;padding:10px 12px;margin:6px 0 4px}
.docbox .dh{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:14px;margin-bottom:4px}
.docbox .dh b{font-family:var(--num);font-size:22px;color:var(--red)}
.docbox.ok .dh b{color:var(--green)}
.docbox .li{display:flex;justify-content:space-between;font-size:13.5px;padding:2px 0;color:#30343B}
.docbox .li span:last-child{font-family:var(--num);font-size:15.5px;font-weight:600}
.docbox small{display:block;color:var(--mut);font-size:12px;margin-top:4px}
.mres .li{display:flex;justify-content:space-between;font-size:13.5px;padding:3px 0;border-bottom:1px solid #EEF0F3}
.mres .li:last-child{border-bottom:0}
.mres .li span:last-child{font-family:var(--num);font-size:15.5px;font-weight:600}
.empty{color:var(--green);font-weight:600;margin:6px 0;font-size:14px}
.add{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding:10px;background:#fff;border:1px dashed #D9DCE2;border-radius:12px;align-items:center}
.add input[type=date]{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff}
.add .mi{width:170px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
@media(max-width:640px){
  input,select,textarea{font-size:16px!important}
  .nm{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.25}
  .filtros{flex-wrap:nowrap;overflow-x:auto;margin-left:-16px;margin-right:-16px;padding:0 16px 2px;scrollbar-width:none}
  .filtros::-webkit-scrollbar{display:none}
  .fchip{flex:none;white-space:nowrap}
  .tools select,.dtools select{flex:1}
  .cp,.wa,.conf{font-size:12.5px}
  .fine{grid-template-columns:auto minmax(0,1fr) auto}
  .fine .mi{grid-column:2/4}
  .fine .obs{grid-column:1/3}
  .fine .fa{grid-column:3}
  .btn.obr.on{font-size:12px}
  .head{gap:10px;padding:12px 12px 10px}
  .plate{width:84px}.plate b{font-size:14.5px}
  .quick{padding:0 12px 12px}
  .conf,.wa{margin-left:0}
  .add .mi{flex:1;width:auto}
  .add .btn{width:100%}
  .brand h1{font-size:17px}
  .lbl-long{display:none}
}
@media(min-width:641px){.lbl-short{display:none}}

/* abas */
.tabs{max-width:980px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left))}
.seg{display:flex;background:#E4E6EA;border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:7px 10px;font-weight:650;font-size:14px;color:var(--mut);transition:all .25s var(--ease)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.12)}
.seg button .n{font-family:var(--num);font-size:15px;margin-left:5px;color:var(--red)}
#pgDebitos{display:none}
body.deb #pgMultas{display:none} body.deb #pgDebitos{display:block} body.deb #btnCopiarTudo{display:none}
/* débitos */
.dsec{margin-top:4px}
.dsec h4{margin:12px 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.drow{display:grid;grid-template-columns:118px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #EEF0F3}
.drow:last-child{border-bottom:0}
.drow .tp{font-weight:700;font-size:14px}
.drow .det{font-size:13px;color:var(--mut)}
.drow .rt{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.st-ok,.st-pend,.st-aviso,.st-sem{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:5px;margin-right:6px;vertical-align:1px}
.st-ok{background:var(--green-s);color:var(--green)} .st-pend{background:var(--red-s);color:var(--red)}
.st-aviso{background:var(--amber-s);color:var(--amber)} .st-sem{background:var(--soft);color:var(--mut)}
.dl{display:grid;grid-template-columns:110px 132px 150px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #EEF0F3}
.dl .tp{font-weight:700;font-size:13.5px}
.dl input[type=date]{border:1px solid var(--line);border-radius:8px;padding:6px 7px;background:#fff;min-width:0;width:100%}
.dl .pg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.dl.pago .tp{color:var(--green)}
.hist{margin-top:10px;border:1px solid var(--line);border-radius:12px;background:#fff}
.hist summary{cursor:pointer;padding:10px 12px;font-weight:650;font-size:14px;list-style:none;display:flex;justify-content:space-between}
.hist summary::-webkit-details-marker{display:none}
.hy{padding:0 12px 10px}
.hy h5{margin:10px 0 4px;font-size:13px;display:flex;justify-content:space-between}
.hy h5 b{font-family:var(--num);font-size:16px}
.hi{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:#30343B}
.hi span:last-child{font-family:var(--num);font-size:15px;font-weight:600}
.dtools{display:flex;gap:8px;margin:12px 0 8px;flex-wrap:wrap}
.nd{font-family:var(--num);font-size:20px;font-weight:700;line-height:1;white-space:nowrap}
.nd.red{color:var(--red)} .nd.grn{color:var(--green)}
@media(max-width:640px){
  .drow{grid-template-columns:1fr auto}
  .drow .det{grid-column:1/-1;order:3}
  .dl{grid-template-columns:minmax(0,1fr)}
  .dl .pg{display:grid;grid-template-columns:62px minmax(0,1fr);align-items:center}
  .dl .pg input{min-width:0;width:100%}
  .dl .fa{justify-content:flex-end}
}

/* janelas */
dialog{border:0;border-radius:18px;padding:0;width:min(580px,calc(100vw - 32px));max-height:calc(100vh - 48px);box-shadow:0 24px 70px rgba(16,24,40,.25);color:var(--ink)}
dialog[open]{animation:sheet .35s var(--ease)}
/* teclado aberto (iPhone): a janela fica na parte visível, acima do teclado */
html.teclado dialog[open]{position:fixed;top:calc(var(--vvt,0px) + 8px);bottom:auto;margin:0 auto;max-height:calc(var(--vvh,100vh) - 16px)}
html.teclado #toast{bottom:auto;top:calc(var(--vvt,0px) + 12px)}
@keyframes sheet{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
dialog::backdrop{background:rgba(15,17,21,.38);backdrop-filter:blur(3px)}
.dlg-in{padding:18px 18px 16px}
.dlg-in h2{margin:0 0 4px;font-size:18px}
.dlg-in .hint{color:var(--mut);font-size:13px;margin:0 0 12px}
.f{display:grid;gap:4px;margin-bottom:10px}
.f label{font-size:12.5px;font-weight:600;color:var(--mut)}
.f input,.f select{border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff;width:100%}
.f2{display:grid;grid-template-columns:120px 1fr;gap:8px}
.ck{display:flex;gap:8px;align-items:center;font-size:14px;margin:6px 0}
textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical;background:var(--soft)}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.hl{list-style:none;margin:0;padding:0;max-height:52vh;overflow:auto}
.hl li{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.hl li b{font-family:var(--num);font-size:17px}
.hl li small{color:var(--mut);display:block;font-size:12px}
.radio{display:grid;gap:6px;margin:10px 0}
.radio label{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:13.5px;cursor:pointer}
.radio label:has(input:checked){border-color:var(--amber);background:var(--amber-s)}
.radio small{display:block;color:var(--mut)}

/* Lê o texto no formato do grupo do WhatsApp */
function parseTexto(txt){
  const out = []; let cur = null, nome = null;
  for(const raw of String(txt).split(/\r?\n/)){
    const l = raw.replace(/[\u200e\u200f\u200b]/g,'').trim();

    let m;

    }
    if(cur && (m = l.match(/^\*?(cpf|cnpj)\*?\s*[-–—:]\s*(.+)$/i))){ cur.docTipo = m[1].toUpperCase(); cur.doc = m[2].trim(); continue; }
    if(cur && (m = l.match(/^\*?placa\*?\s*[-–—:]\s*(.+)$/i))){
      cur.placa = m[1].trim().toUpperCase(); cur.frota = HUDSON.has(normPlaca(cur.placa)) ? 'hudson' : 'fabio'; continue;
    }
    if(/^\(\s*\d+\s*multas?\s*\)$/i.test(l) || /^\*?total\b/i.test(l)) continue;
    if((m = l.match(/^(\d{2})\/(\d{2})\/(\d{4})(.*)$/))){
      if(!cur) continue;
      const resto = m[4] || ''; let valor = null, obs = '';
      const mo = resto.match(/\(([^)]*)\)\s*$/); if(mo) obs = mo[1].trim();

/* ---------- carimbo por item (carro e multa), lixeira com data ---------- */
let _prev = {v:{}, f:{}};
const hashV = v => JSON.stringify([v.nome, !!v.destaque, v.renavam, v.docTipo, v.doc, v.placa, v.frota, v.conferido || null, v.copiadoEm || null, v.pos, v.fipeIpva || null]);
const hashF = m => m.tipo ? JSON.stringify(['d', m.tipo, +m.ano, m.valor ?? null, m.venc || '', m.pagoEm || '', m.obs || '', m.ref ?? null, !!m.auto]) : JSON.stringify([m.data, m.valor ?? null, m.obs || '', m.pagaEm || null, !!m.auto, !!m.obrig]);
const itensDe = v => [...v.multas, ...v.pagas, ...(v.debitos || [])];
function fotografar(){
  _prev = {v:{}, f:{}};
  S.veiculos.forEach(v => { _prev.v[v.id] = hashV(v); itensDe(v).forEach(m => _prev.f[m.id] = hashF(m)); });

function carimbar(){
  const agora = Date.now(); S.tomb = S.tomb || {}; S.tombV = S.tombV || {};
  let maxPos = S.veiculos.reduce((a, v) => Math.max(a, v.pos ?? -1), -1);
  const vistosV = {}, vistosF = {};
  S.veiculos.forEach(v => {
    vistosV[v.id] = 1;
    if(v.pos == null) v.pos = ++maxPos;
    if(_prev.v[v.id] !== hashV(v) || !v.rev) v.rev = agora;
    delete S.tombV[v.id];
    v.debitos = v.debitos || [];
    itensDe(v).forEach(m => {
      vistosF[m.id] = 1;
      if(_prev.f[m.id] !== hashF(m) || !m.rev) m.rev = agora;
      delete S.tomb[m.id];
    });
  });
  for(const id in _prev.v) if(!vistosV[id]) S.tombV[id] = agora;
  for(const id in _prev.f) if(!vistosF[id]) S.tomb[id] = agora;
  const limite = agora - 400*864e5;   // lixeira com mais de ~13 meses é descartada
  for(const k in S.tomb) if(S.tomb[k] < limite) delete S.tomb[k];
  for(const k in S.tombV) if(S.tombV[k] < limite) delete S.tombV[k];
  fotografar();
}

/* ---------- união item a item (nenhum aparelho apaga dado do outro) ---------- */
const normF = m => ({...m, valor: m.valor == null ? null : +m.valor, obs: m.obs || '', rev: m.rev || 0});
const normD = d => ({...d, ano: +d.ano || 0, valor: d.valor == null ? null : +d.valor, venc: d.venc || '', pagoEm: d.pagoEm || '', obs: d.obs || '', rev: d.rev || 0});
const lista0 = x => (Array.isArray(x) ? x : Object.values(x || {})).filter(Boolean);
function doRemoto(r){
  if(!r || !r.veiculos) return null;
  return {
    veiculos: Object.values(r.veiculos).filter(Boolean).map(v => ({...v, destaque: !!v.destaque, conferido: v.conferido || null, copiadoEm: v.copiadoEm || null,
      multas: lista0(v.multas).map(normF), pagas: lista0(v.pagas).map(normF), debitos: lista0(v.debitos).map(normD), rev: v.rev || 0})),
    tomb: r.tomb || {}, tombV: r.tombV || {}, saidas: r.saidas || {}
  };
}
const estadoLocal = () => ({veiculos: S.veiculos, tomb: S.tomb || {}, tombV: S.tombV || {}, saidas: S.saidas || {}});
function mesclarEstado(a, b){
  const tomb = {...(a.tomb || {})}, tombV = {...(a.tombV || {})};
  for(const k in (b.tomb || {})) tomb[k] = Math.max(tomb[k] || 0, b.tomb[k]);
  for(const k in (b.tombV || {})) tombV[k] = Math.max(tombV[k] || 0, b.tombV[k]);
  const saidas = {};
  [a.saidas || {}, b.saidas || {}].forEach(m => { for(const k in m){ const x = saidas[k] || {}; saidas[k] = {saiu: Math.max(x.saiu || 0, m[k].saiu || 0), voltou: Math.max(x.voltou || 0, m[k].voltou || 0), apagadoGestao: Math.max(x.apagadoGestao || 0, m[k].apagadoGestao || 0)}; } });
  const mapa = new Map();
  for(const v of [...a.veiculos, ...b.veiculos]){
    let ent = mapa.get(v.id);
    if(!ent){ ent = {meta: v, fines: new Map()}; mapa.set(v.id, ent); }
    else if((v.rev || 0) > (ent.meta.rev || 0)) ent.meta = v;
    for(const m of [...(v.multas || []), ...(v.pagas || []), ...(v.debitos || [])]){
      const e = ent.fines.get(m.id);
      if(!e || (m.rev || 0) > (e.rev || 0)) ent.fines.set(m.id, m);
    }
  }
  const out = [];
  for(const [id, ent] of mapa){
    if(tombV[id] && tombV[id] >= (ent.meta.rev || 0)) continue;
    delete tombV[id];
    const v = {...ent.meta, multas: [], pagas: [], debitos: []};
    for(const [fid, m] of ent.fines){
      if(tomb[fid] && tomb[fid] >= (m.rev || 0)) continue;
      delete tomb[fid];
      (m.tipo ? v.debitos : m.pagaEm ? v.pagas : v.multas).push({...m});
    }
    v.multas.sort(cmpData);
    v.pagas.sort((x, y) => (y.pagaEm || '').localeCompare(x.pagaEm || '') || cmpData(x, y));
    v.debitos.sort(cmpDeb);
    out.push(v);
  }
  out.sort((x, y) => (x.pos ?? 0) - (y.pos ?? 0));
  return {veiculos: out, tomb, tombV, saidas};
}
function estavel(x){
  if(Array.isArray(x)) return '[' + x.map(estavel).join(',') + ']';
  if(x && typeof x === 'object') return '{' + Object.keys(x).filter(k => x[k] !== undefined && x[k] !== null).sort().map(k => JSON.stringify(k) + ':' + estavel(x[k])).join(',') + '}';
  return JSON.stringify(x ?? null);
}
function canon(st){
  const pid = (a, b) => a.id < b.id ? -1 : 1;
  return estavel({v: st.veiculos.map(v => ({...v, multas: [...v.multas].sort(pid), pagas: [...v.pagas].sort(pid), debitos: [...(v.debitos || [])].sort(pid)})).sort(pid), t: st.tomb, tv: st.tombV, sd: st.saidas || {}});
}
function paraRemoto(st){
  const veiculos = {};
  st.veiculos.forEach(v => { veiculos[v.id] = JSON.parse(JSON.stringify(v)); });
  return {versao: 1, em: Date.now(), veiculos, tomb: st.tomb, tombV: st.tombV, saidas: st.saidas || {}};
}

function aoReceber(r){

/* ---------- utilidades de interface ---------- */
async function copiar(txt, msg){
  let ok = false;
  try{ await navigator.clipboard.writeText(txt); ok = true; }catch(e){}
  if(!ok){
    const t = document.createElement('textarea'); t.value = txt; t.style.cssText = 'position:fixed;opacity:0;top:0';
    document.body.appendChild(t); t.select(); try{ ok = document.execCommand('copy'); }catch(e){} t.remove();
  }
  toast(ok ? (msg || 'Copiado') : 'Não consegui copiar — selecione e copie manualmente');
}
let tt;
function toast(msg, comDesfazer){
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>` + (comDesfazer ? '<button id="undoBtn">Desfazer</button>' : '');
  el.classList.add('on'); clearTimeout(tt);
  tt = setTimeout(() => el.classList.remove('on'), comDesfazer ? 6500 : 2200);
}
function modal(html){ const d = $('#dlg'); d.querySelector('.dlg-in').onclick = null; d.querySelector('.dlg-in').innerHTML = html; if(!d.open) d.showModal(); return d.querySelector('.dlg-in'); }
function fechar(){ $('#dlg').close(); }
function confirmar(msg, botao, cb){
  const c = modal(`<h2>Confirmar</h2><p class="hint" style="font-size:14px">${msg}</p><div class="row"><button class="btn" data-close>Cancelar</button><button class="btn pri" id="okConf">${botao}</button></div>`);
  $('#okConf', c).onclick = () => { fechar(); cb(); };
}
function achar(id){ return S.veiculos.find(x => x.id === id); }
function abrirEIr(v){
  if(!lista().includes(v)){ filtro = 'todos'; busca = ''; $('#q').value = ''; }
  abertos.add(v.id); render();
  const el = $(`.car[data-id="${v.id}"]`); if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

function modalHist(v){
  const pinta = () => {
    const tot = v.pagas.reduce((s,m) => s + (m.valor||0), 0);

        <div class="fa"><button class="btn sm" data-h="volta">↩ Voltar p/ aberto</button><button class="btn sm ghost x" data-h="apaga" title="Apagar do histórico">✕</button></div></li>`).join('')}</ul>`

function modalImportar(){
  const c = modal(`<h2>Importar texto do WhatsApp</h2>
    <p class="hint">Cole a lista no mesmo padrão do grupo (nome, Renavam, CPF/CNPJ, Placa, datas). Pode ter valor na linha da data, ex.: <code>10/02/2026 - R$ 195,23</code>.</p>
    <textarea id="imTxt" rows="10" placeholder="Cole aqui…"></textarea>
    <div class="radio">
      <label><input type="radio" name="imM" value="mesclar" checked><span><b>Atualizar o que já existe</b><small>Acha o carro pelo Renavam/placa, mantém os valores já lançados e manda para o histórico as multas que não aparecem mais.</small></span></label>
      <label><input type="radio" name="imM" value="substituir"><span><b>Substituir tudo</b><small>Apaga a lista atual e fica só com o texto colado.</small></span></label>
    </div>
    <div class="row"><button class="btn" data-close>Cancelar</button><button class="btn pri" id="imOk">Importar</button></div>`);
  $('#imOk', c).onclick = () => {
    const novos = parseTexto($('#imTxt', c).value);
    if(!novos.length){ toast('Não achei nenhum carro nesse texto'); return; }
    snap();
    const modo = c.querySelector('input[name=imM]:checked').value;
    if(modo === 'substituir'){ S.veiculos = novos; abertos.clear(); save(); fechar(); render(); toast(`${novos.length} carros importados`, true); return; }
    let at = 0, nv = 0, pg = 0;
    for(const n of novos){
      const ex = S.veiculos.find(v => (n.renavam && soDig(v.renavam) === soDig(n.renavam)) || (n.placa && normPlaca(v.placa) === normPlaca(n.placa)));
      if(!ex){ S.veiculos.push(n); nv++; continue; }
      at++;
      const sobra = [...ex.multas];
      ex.multas = n.multas.map(m => {
        const i = sobra.findIndex(o => o.data === m.data);
        if(i >= 0){ const o = sobra.splice(i,1)[0]; return {...o, valor: m.valor ?? o.valor, obs: m.obs || o.obs}; }
        return m;
      });
      sobra.forEach(o => { ex.pagas.unshift({...o, pagaEm:isoHoje(), auto:true}); pg++; });
      Object.assign(ex, {nome:n.nome, destaque:n.destaque, renavam:n.renavam || ex.renavam, docTipo:n.docTipo, doc:n.doc || ex.doc, placa:n.placa || ex.placa});
    }
    save(); fechar(); render();
    toast(`${at} atualizados · ${nv} novos · ${pg} foram p/ histórico`, true);
  };
  setTimeout(() => $('#imTxt', c).focus(), 50);
}

function fazerBackup(){
  const blob = new Blob([JSON.stringify({app:'guimas-multas', versao:1, em:new Date().toISOString(), dados:S}, null, 1)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `multas-backup-${isoHoje()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  S.ultimoBackup = new Date().toISOString(); save(false); renderAvisos(); toast('Backup baixado — guarde o arquivo');
}

/* ---------- v2 · MODO CONSULTA (rotina de segunda): um carro por vez, em tela cheia ----------
   Mesmos dados e mesmas regras: só marca "conferido hoje", copia Renavam/CPF/placa e
   adiciona multa nova (sem valor, como sempre). Valor, obrigatória e baixa continuam no cartão. */
let MC_ID = null, RES_ABERTO = false;
const obrSemValor = v => v.multas.filter(m => m.obrig && m.valor == null).length;
function mcLista(){ return ordenar(S.veiculos.slice()); }
function mcProximo(depoisDe){
  const l = mcLista(), i = l.findIndex(x => x.id === depoisDe);
  const resto = i >= 0 ? l.slice(i + 1).concat(l.slice(0, i)) : l;
  const v = resto.find(x => !confHoje(x) && x.id !== depoisDe);
  return v ? v.id : null;
}
function abrirModoConsulta(){
  const v = mcLista().find(x => !confHoje(x));
  MC_ID = v ? v.id : null; mcRender();
  $('#mc').hidden = false; document.body.classList.add('mcOn'); window.scrollTo(0, 0);
}
function fecharModoConsulta(){ $('#mc').hidden = true; document.body.classList.remove('mcOn'); render(); }
function mcRender(){
  const l = mcLista(), N = l.length, ok = l.filter(confHoje).length, pct = N ? Math.round(ok / N * 100) : 0;
  const v = MC_ID && achar(MC_ID);
  const topo = `<div class="mcTop"><div><b>Consulta de ${br(isoHoje())}</b><small>${ok} de ${N} conferidos</small></div><button class="mcX" data-mc="fechar" aria-label="Sair da consulta">✕</button></div><div class="bar"><i style="width:${pct}%"></i></div>`;
  if(!v){
    $('#mc .mcIn').innerHTML = topo + `<div class="mcFim"><div class="mcOk">✓</div><h2>Consulta concluída</h2><p>Os ${N} carros foram conferidos hoje.</p>
      <button class="btn pri mcBig" data-mc="grupo">⧉ Enviar para o grupo</button><button class="btn mcBig" data-mc="fechar">Voltar para a lista</button></div>`;
    return;
  }
  const t = tot(v);
  const datas = v.multas.map(m => `<span class="mcData${m.obrig ? ' obr' : ''}">${br(m.data)}${m.obrig ? ' · obrig.' : ''}</span>`).join('');
  const linha = (rot, val) => `<button class="mcCp" data-mc="cp" data-v="${esc(val)}"><small>${esc(rot)}</small><b>${esc(val || '—')}</b><span>Copiar</span></button>`;
  $('#mc .mcIn').innerHTML = topo + `
    <div class="mcCar">
      <div class="mcHead"><div class="plate mcPlate"><i>BRASIL</i><b>${esc(v.placa || '—')}</b></div>
        <div><div class="mcNome">${esc(v.nome)}</div><div class="sub"><span class="tg ${v.frota}">${v.frota === 'hudson' ? 'Frota Hudson' : 'Frota Fábio'}</span>${motoristaTag(v)}</div></div></div>
      <div class="mcCopias">${linha('Renavam', v.renavam)}${linha(v.docTipo || 'CPF', v.doc)}${linha('Placa', v.placa)}</div>
      <div class="mcMultas"><div class="mcK">${t.n ? t.n + (t.n === 1 ? ' multa em aberto' : ' multas em aberto') : 'Nenhuma multa em aberto'}</div>${datas ? `<div class="mcDatas">${datas}</div>` : ''}</div>
      <div class="mcAdd"><label class="mcK" for="mcData">Apareceu multa nova?</label><div class="mcAddRow"><input type="date" id="mcData" max="${isoHoje()}"><button class="btn" data-mc="add">＋ Adicionar</button></div></div>
    </div>
    <div class="mcPe"><button class="btn mcPular" data-mc="pular">Pular</button><button class="btn grn mcBig" data-mc="ok">${t.n ? 'Conferido' : 'Sem multa'} ✓ · próximo</button></div>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('#mc [data-mc]'); if(!b) return;
  const v = MC_ID && achar(MC_ID), a = b.dataset.mc;
  if(a === 'fechar'){ fecharModoConsulta(); return; }
  if(a === 'grupo'){ fecharModoConsulta(); modalCopiar(); return; }
  if(!v) return;
  if(a === 'cp'){ if(b.dataset.v) copiar(b.dataset.v, 'Copiado: ' + b.dataset.v); return; }
  if(a === 'add'){
    const d = ($('#mcData') || {}).value;
    if(!d){ toast('Escolha a data da multa'); return; }
    v.multas.push({id:uid(), data:d, valor:null, obs:''}); v.multas.sort(cmpData); v.conferido = isoHoje();
    save(); mcRender(); toast(`Multa de ${br(d)} adicionada`); return;
  }
  if(a === 'pular'){ const p = mcProximo(v.id); if(p){ MC_ID = p; mcRender(); } else toast('Não há outro carro para conferir'); return; }
  if(a === 'ok'){ v.conferido = isoHoje(); save(); MC_ID = mcProximo(v.id); mcRender(); return; }
});

/* ---------- eventos ---------- */
$('#list').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act; if(act === 'valor' || act === 'obs') return;
  const card = b.closest('.car'), v = card && achar(card.dataset.id); if(!v) return;
  const fid = b.closest('.fine') && b.closest('.fine').dataset.fid;
  const iM = fid ? v.multas.findIndex(m => m.id === fid) : -1;
  switch(act){
    case 'toggle':
      if(abertos.has(v.id)) abertos.delete(v.id); else { abertos.add(v.id); animarId = v.id; }
      refreshCard(v); break;
    case 'cp':
      if(b.dataset.v) copiar(b.dataset.v, 'Copiado: ' + b.dataset.v); break;
    case 'conf':
      v.conferido = confHoje(v) ? null : isoHoje(); save();
      if(filtro === 'pend') render(); else { refreshCard(v); renderConsulta(); }
      if(confHoje(v) && S.veiculos.every(confHoje)) toast('Todos os carros conferidos ✓');
      break;
    case 'obrig': {
      const m = v.multas[iM]; if(!m) break;
      m.obrig = !m.obrig; v.conferido = isoHoje(); save(); refreshCard(v); renderLeve();
      toast(m.obrig ? `Multa de ${br(m.data)}: obrigatória para o documento` : `Multa de ${br(m.data)}: não obrigatória`); break; }
    case 'pagar': {
      v.conferido = isoHoje(); snap(); const [m] = v.multas.splice(iM, 1); v.pagas.unshift({...m, pagaEm:isoHoje()});
      save(); refreshCard(v); renderLeve(); toast(`Multa de ${br(m.data)} baixada como paga`, true); break; }
    case 'delm': {
      v.conferido = isoHoje(); snap(); const [m] = v.multas.splice(iM, 1);
      save(); refreshCard(v); renderLeve(); toast(`Multa de ${br(m.data)} excluída`, true); break; }
    case 'chip': {
      const val = parseFloat(b.dataset.v);
      const alvo = (ultimoValorInput && card.contains(ultimoValorInput)) ? ultimoValorInput : card.querySelector('.fine [data-act=valor]');
      if(!alvo) break;
      alvo.value = num2(val); alvo.dispatchEvent(new Event('change', {bubbles:true}));
      const linhas = $$('.fine [data-act=valor]', card), i = linhas.indexOf(alvo);
      const prox = linhas.slice(i+1).find(x => !x.value) || linhas[i+1];
      if(prox){ prox.focus(); ultimoValorInput = prox; }
      break; }
    case 'add': {
      const dI = card.querySelector('.ad-data'), vI = card.querySelector('.ad-valor');
      if(!dI.value){ toast('Escolha a data da multa'); dI.focus(); break; }

/* ---------- AUTOMAÇÃO COM O GESTÃO ----------
   Carro novo no Gestão entra aqui sozinho (id fixo 'g'+placa: dois aparelhos criam o MESMO carro).
   CPF/CNPJ vem do dono: aprendido dos carros que já existem com o mesmo proprietário.
   Frota segue o Gestão. Nada é gravado no Gestão. Carro apagado aqui não volta. */
const capP = s => String(s || '').toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase());
/* Motorista do carro (vem do Gestão): primeiro nome; sem motorista = Parado */
function motoristaTag(v){
  const g = gCarro(v); if(!g) return '';
  const n = String(g.motorista || '').trim().split(/\s+/)[0];
  return n ? `<span class="tg mot" title="${esc(g.motorista)}">${esc(capP(n))}</span>` : '<span class="tg par">Parado</span>';
}
/* PADRÃO DO NOME: Modelo + Cor + Ano (ex.: "Logan Branco 2017"). Versão/acabamento sai.
   Cor e ano seguem o Gestão quando o carro está lá. */
const CORES = {branco:'Branco',branca:'Branco',prata:'Prata',preto:'Preto',preta:'Preto',cinza:'Cinza',vermelho:'Vermelho',vermelha:'Vermelho',azul:'Azul',bege:'Bege',verde:'Verde',dourado:'Dourado',dourada:'Dourado',marrom:'Marrom',amarelo:'Amarelo',amarela:'Amarelo',grafite:'Grafite',vinho:'Vinho',laranja:'Laranja',roxo:'Roxo',roxa:'Roxo',rosa:'Rosa'};
const SEGUNDA = new Set(['siena','sedan','plus','weekend','cross','tour','sport']);
const capW = w => /\d/.test(w) ? w.toUpperCase() : w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
function padronizarNome(nome, g){
  const ws = String(nome || '').replace(/\*/g, ' ').trim().split(/\s+/).filter(Boolean);
  let cor = '', ano = ''; const mod = [];
  ws.forEach(w => { const k = semAc(w).toLowerCase(); if(CORES[k]){ if(!cor) cor = CORES[k]; } else if(/^(19|20)\d{2}$/.test(w)){ if(!ano) ano = w; } else mod.push(w); });
  let m = mod.length ? [capW(mod[0])] : [];
  if(mod.length > 1 && (SEGUNDA.has(semAc(mod[1]).toLowerCase()) || semAc(mod[0]).toLowerCase() === 'grand')) m.push(capW(mod[1]));
  if(g){
    const gc = CORES[semAc(String(g.cor || '').trim().split(/\s+/)[0]).toLowerCase()]; if(gc) cor = gc;
    const anos = String(g.ano || '').match(/(19|20)\d{2}/g) || []; if(anos.length && !anos.includes(ano)) ano = anos[anos.length - 1];
    if(!m.length){ const gn = String(g.nome || g.modeloCRLV || '').trim().split(/\s+/); if(gn[0]) m = [capW(gn[0])]; }
  }
  return [m.join(' '), cor, ano].filter(Boolean).join(' ');
}
const fmtPlaca = p => { const n = normPlaca(p); return n.length === 7 ? n.slice(0, 3) + '-' + n.slice(3) : n; };
const donoKey = p => semAc(p).toUpperCase().replace(/\s+/g, ' ').trim();
function nomeDoGestao(c){
  const base = String(c.nome || c.modeloCRLV || 'Carro').trim();
  if(/\b(19|20)\d{2}\b/.test(base)) return base;
  const anos = String(c.ano || '').match(/(19|20)\d{2}/g), ano = anos ? anos[anos.length - 1] : '';
  const cor = c.cor && !semAc(base).toLowerCase().includes(semAc(c.cor).toLowerCase()) ? capP(c.cor) : '';
  return [base, cor, ano].filter(Boolean).join(' ');
}
function noGestao(v){
  if(!GEST.idx) return true;
  if(GEST.idx[normPlaca(v.placa)]) return true;
  const r = +soDig(v.renavam); return !!r && Object.values(GEST.idx).some(g => +soDig(g.renavam) === r);
}
const canonPlaca = p => {
  const n = normPlaca(p); if(n.length !== 7) return n;
  const L = x => x.replace(/0/g, 'O').replace(/1/g, 'I'), D = x => x.replace(/[OQ]/g, '0').replace(/I/g, '1');
  let c4 = n[4]; if(/\d/.test(c4)) c4 = 'ABCDEFGHIJ'[+c4];
  return L(n.slice(0, 3)) + D(n[3]) + c4 + D(n.slice(5));
};
/* GRT (taxa de licenciamento + CRLV-e) que vocês pagam por carro; ano sem valor usa o último conhecido */
const GRT_VALOR = {2026: 293.71};
const valorGRT = ano => GRT_VALOR[ano] ?? GRT_VALOR[Math.max(...Object.keys(GRT_VALOR).map(Number).filter(a => a <= ano).concat([Math.min(...Object.keys(GRT_VALOR).map(Number))]))];
/* IPVA RJ: 4% gasolina/flex, 1,5% GNV ou híbrido, 0,5% elétrico; cota única com 3% de desconto */
function aliquotaIPVA(g){
  const c = semAc(String(g && g.combustivel || '')).toUpperCase();
  const eletr = /ELETRIC/.test(c), comb = /GASOL|ALCOOL|ETANOL|FLEX|DIESEL/.test(c);
  if(/HIBRID/.test(c) || (eletr && comb)) return {aliq: 0.015, tipo: 'híbrido'};
  if(eletr) return {aliq: 0.005, tipo: 'elétrico'};
  if(/GNV|GAS NATURAL/.test(c) || (g && (g.gnvExercicio || g.gnvRequalif))) return {aliq: 0.015, tipo: 'GNV'};
  return {aliq: 0.04, tipo: 'gasolina/flex'};
}
function ipvaEstimado(v, g, ano){
  const fi = v.fipeIpva || {}, jan = fi[ano] && fi[ano + 'f'] === 'jan';
  const base = fi[ano] || +g.valorRef || 0;
  if(!base) return {valor: null, obs: 'estimado · sem FIPE no Gestão'};
  const a = aliquotaIPVA(g), val = Math.round(base * a.aliq * 0.97 * 100) / 100;
  return {valor: val, obs: `estimado · FIPE ${jan ? 'jan/' + ano : 'atual'} ${money(base)} × ${String(a.aliq * 100).replace('.', ',')}% (${a.tipo}) − 3% cota única`};
}
/* FIPE de JANEIRO do ano, direto da tabela FIPE (mesmos códigos de marca/modelo/ano vinculados no Gestão).
   Roda sozinho uma vez por ano por carro; atualiza o IPVA ainda não pago. Se a FIPE estiver fora do ar, fica a estimativa. */
const FIPE2 = 'https://fipe.parallelum.com.br/api/v2';
let _fipeRodando = false;
async function buscarFipeJaneiro(){
  if(_fipeRodando || !GEST.idx || !recebeuNuvem) return;
  const Y = new Date().getFullYear();
  const alvos = S.veiculos.filter(v => { const g = gCarro(v); return g && g.fipeM && g.fipeMo && g.fipeA && (v.fipeIpva || {})[Y + 'f'] !== 'jan'; });
  if(!alvos.length) return;
  _fipeRodando = true;
  try{
    const refs = await fetch(FIPE2 + '/references').then(r => r.json());
    const ref = (refs || []).find(x => new RegExp('^janeiro\\/' + Y + '$', 'i').test(String(x.month || '').trim()));
    if(!ref) return;
    let n = 0;
    for(const v of alvos){
      const g = gCarro(v);
      try{
        const d = await fetch(`${FIPE2}/cars/brands/${g.fipeM}/models/${g.fipeMo}/years/${g.fipeA}?reference=${ref.code}`).then(r => r.ok ? r.json() : null);
        const val = d && parseValor(d.price);
        if(val){ v.fipeIpva = {...(v.fipeIpva || {}), [Y]: val, [Y + 'f']: 'jan'}; n++; }
      }catch(e){}
      await new Promise(r => setTimeout(r, 300));
    }
    if(n){
      S.veiculos.forEach(v => { const g = gCarro(v); if(!g) return;
        (v.debitos || []).forEach(d => { if(d.tipo === 'ipva' && +d.ano === Y && !d.pagoEm && /^(estimado|calculado)/.test(d.obs || '')){ const e = ipvaEstimado(v, g, Y); d.valor = e.valor; d.obs = e.obs; } }); });
      save(); render();
    }
  }catch(e){} finally { _fipeRodando = false; }
}
const CORTE_SAIDA = Date.parse('2026-10-05T16:30:00Z');   // só conta carro apagado no Gestão a partir de 05/10/2026 13:30
function refAtual(g, tipo){
  if(!g) return null;
  if(tipo === 'ipva' || tipo === 'grt') return parseInt(g.exercicioCRLV, 10) || 0;
  if(tipo === 'vistoria') return parseInt(g.gnvExercicio, 10) || 0;
  if(tipo === 'reteste') return g.gnvRequalif || '';
  return null;
}
/* Débito lançado enquanto pendente é baixado sozinho quando o Gestão mostra o documento novo */
function baixaAutomatica(v, g){
  let n = 0;
  (v.debitos || []).forEach(d => {
    if(d.pagoEm || d.ref == null || !g) return;
    const agora = refAtual(g, d.tipo);
    let quitou = false;
    if(d.tipo === 'ipva' || d.tipo === 'grt' || d.tipo === 'vistoria') quitou = agora >= d.ano && agora > d.ref;
    else if(d.tipo === 'reteste') quitou = !!agora && String(agora) > String(d.ref);
    if(quitou){ d.pagoEm = isoHoje(); d.auto = true; n++; }
  });
  return n;
}
function sincronizarComGestao(){
  if(!GEST.idx || !recebeuNuvem) return;
  const agora = Date.now(), nG = Object.keys(GEST.idx).length;
  S.saidas = S.saidas || {}; S.tombV = S.tombV || {};
  const novos = [], saiu = [], voltaram = []; let mudou = false, baixas = 0, gerados = 0;
  // 0) DEVOLVE os carros que a v4 tirou por engano (saída sem apagamento no Gestão)
  const sem = semente();
  for(const pk in S.saidas){
    const sd = S.saidas[pk];
    if(!((sd.saiu || 0) > (sd.voltou || 0)) || sd.apagadoGestao) continue;
    if(S.veiculos.some(v => normPlaca(v.placa) === pk)){ S.saidas[pk] = {...sd, voltou: agora}; mudou = true; continue; }
    const base = sem.find(v => normPlaca(v.placa) === pk);
    if(!base) continue;
    delete S.tombV[base.id];
    base.rev = 0; base.multas.forEach(m => m.rev = 0);       // carimbo novo na gravação vence a lixeira
    S.veiculos.push(base); S.saidas[pk] = {...sd, voltou: agora}; voltaram.push(base.nome); mudou = true;
  }
  if(voltaram.length) S.veiculos.sort((x, y) => (x.pos ?? 0) - (y.pos ?? 0));
  // 1) ALINHA COM O GESTÃO — o Gestão manda (placa e Renavam vêm dos documentos do carro)
  const idx = GEST.idx, Gs = Object.values(idx), dono = {}, link = new Map(), ajustes = [];
  const livre = g => !dono[normPlaca(g.placa)];
  const liga = (v, g) => { dono[normPlaca(g.placa)] = v; link.set(v, g); };
  [S.veiculos.filter(v => v.id[0] !== 'g'), S.veiculos.filter(v => v.id[0] === 'g')].forEach(grupo => {
    grupo.forEach(v => { const g = idx[normPlaca(v.placa)]; if(g && livre(g)) liga(v, g); });                                     // placa igual
    grupo.forEach(v => { if(link.has(v)) return; const r = +soDig(v.renavam); const g = r && Gs.find(x => livre(x) && +soDig(x.renavam) === r); if(g) liga(v, g); });   // mesmo Renavam
    grupo.forEach(v => { if(link.has(v)) return; const k = canonPlaca(v.placa); const c = Gs.filter(x => livre(x) && canonPlaca(x.placa) === k); if(c.length === 1) liga(v, c[0]); });   // placa parecida (O/0, I/1, Mercosul)
  });
  const dup = S.veiculos.filter(v => v.id[0] === 'g' && !link.has(v) && !v.multas.length && !v.pagas.length && !(v.debitos || []).length);
  if(dup.length){ S.veiculos = S.veiculos.filter(v => !dup.includes(v)); dup.forEach(v => ajustes.push(`cadastro repetido removido: ${v.nome} (${v.placa})`)); mudou = true; }
  link.forEach((g, v) => {
    const p = fmtPlaca(g.placa);
    if(v.placa !== p){ ajustes.push(`${v.nome}: placa ${v.placa} → ${p}`); v.placa = p; mudou = true; }
    if(soDig(g.renavam)){ const r = soDig(g.renavam).padStart(11, '0'); if(soDig(v.renavam) !== r){ ajustes.push(`${v.nome}: Renavam ${v.renavam || '—'} → ${r}`); v.renavam = r; mudou = true; } }
  });
  S.veiculos.forEach(v => {
    const g = link.get(v) || null, nn = padronizarNome(v.nome, g);
    if(nn && nn !== v.nome){ ajustes.push(`nome: ${v.nome} → ${nn}`); v.nome = nn; mudou = true; }
    if(v.destaque){ v.destaque = false; mudou = true; }
  });
  // 2) SÓ sai daqui o carro APAGADO no Gestão a partir de 05/10/2026 13:30 (carro antigo nunca sai)
  const fora = [];
  if(GAPAG){
    S.veiculos.forEach(v => { const pk = normPlaca(v.placa), ts = +GAPAG['car_' + pk] || 0; if(ts > CORTE_SAIDA && !idx[pk]) fora.push(v); });
    fora.forEach(v => { const pk = normPlaca(v.placa); S.saidas[pk] = {...(S.saidas[pk] || {}), saiu: agora, apagadoGestao: +GAPAG['car_' + pk]}; saiu.push(v.nome); });
    if(fora.length){ S.veiculos = S.veiculos.filter(v => !fora.includes(v)); mudou = true; }
  }
  const docDoDono = {};
  link.forEach((g, v) => { if(g.proprietario && v.doc && S.veiculos.includes(v)) docDoDono[donoKey(g.proprietario)] = {docTipo: v.docTipo, doc: v.doc}; });
  // 3) carro do Gestão que não está aqui entra sozinho
  for(const [pk, g] of Object.entries(idx)){
    const v = dono[pk] && S.veiculos.includes(dono[pk]) ? dono[pk] : null;
    const frota = g.meuCarro ? 'hudson' : 'fabio';
    if(!v){
      const id = 'g' + pk, sd = S.saidas[pk];
      if(sd && !sd.apagadoGestao && (sd.saiu || 0) > (sd.voltou || 0)) continue;   // aguardando a devolução da v4
      if(S.veiculos.some(x => x.id === id)) continue;
      const voltou = sd && sd.apagadoGestao && (sd.saiu || 0) > (sd.voltou || 0) && Math.max(+g.editadoEm || 0, +g.restauradoEm || 0) > sd.apagadoGestao;
      if(sd && sd.apagadoGestao && !voltou && (sd.saiu || 0) > (sd.voltou || 0)) continue;
      if(S.tombV[id] && !voltou) continue;
      if(voltou) S.saidas[pk] = {...sd, voltou: agora};
      delete S.tombV[id];
      const d0 = docDoDono[donoKey(g.proprietario)] || {docTipo: 'CPF', doc: ''};
      const nv = {...novoVeiculo(padronizarNome(nomeDoGestao(g), g)), id, placa: fmtPlaca(g.placa), renavam: soDig(g.renavam) ? soDig(g.renavam).padStart(11, '0') : '', docTipo: d0.docTipo, doc: d0.doc, frota};
      S.veiculos.push(nv); novos.push(nv.nome); mudou = true; continue;
    }
    if(!v.doc && g.proprietario && docDoDono[donoKey(g.proprietario)]){ Object.assign(v, docDoDono[donoKey(g.proprietario)]); mudou = true; }
    if(v.frota !== frota){ v.frota = frota; mudou = true; }

    // CRLV atrasado → GRT e IPVA do ano entram sozinhos (e são baixados sozinhos quando o CRLV novo chegar ao Gestão)
    const exA = parseInt(g.exercicioCRLV, 10) || 0;

      [['grt', () => ({valor: valorGRT(Ya), obs: 'valor fixo', venc: prazoLic(v, Ya)})], ['ipva', () => ({...ipvaEstimado(v, g, Ya), venc: ''})]].forEach(([tp, f]) => {
        const id = `${v.id}-${tp}-${Ya}`;
        if(v.debitos.some(d => d.tipo === tp && +d.ano === Ya) || (S.tomb || {})[id]) return;
        v.debitos.push({id, tipo: tp, ano: Ya, pagoEm: '', ref: exA, ...f()}); v.debitos.sort(cmpDeb); gerados++; mudou = true;
      });
    }
    // 4) débitos quitados pelo documento novo
    const b = baixaAutomatica(v, g); if(b){ baixas += b; mudou = true; }
  }
  if(mudou){
    save(); render();
    const msg = [];
    if(novos.length) msg.push(novos.length === 1 ? `entrou: ${novos[0]}` : `${novos.length} carros entraram`);
    if(voltaram.length) msg.push(voltaram.length === 1 ? `recuperei: ${voltaram[0]}` : `recuperei ${voltaram.length} carros: ${voltaram.join(', ')}`);
    if(saiu.length) msg.push(saiu.length === 1 ? `saiu: ${saiu[0]}` : `${saiu.length} carros saíram`);
    if(gerados) msg.push(`${gerados} débito${gerados > 1 ? 's' : ''} de ${new Date().getFullYear()} lançado${gerados > 1 ? 's' : ''} (GRT/IPVA)`);
    if(baixas) msg.push(`${baixas} débito${baixas > 1 ? 's' : ''} baixado${baixas > 1 ? 's' : ''} pelo Gestão`);
    if(ajustes.length){
      msg.push(`${ajustes.length} ${ajustes.length === 1 ? 'dado corrigido' : 'dados corrigidos'} pelo Gestão`);
      const quando = new Date().toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
      S.ajustes = [...ajustes.map(t => quando + ' · ' + t), ...(S.ajustes || [])].slice(0, 60); gravarLocal();
    }
    if(msg.length) toast('Gestão → ' + msg.join(' · '));
  }
  buscarFipeJaneiro();
}

/* ---------- DÉBITOS (IPVA, GRT, vistoria e reteste do GNV) ---------- */
/* Prazo do licenciamento por final de placa (DETRAN-RJ). Ano sem calendário publicado fica sem prazo. */
const LIC = {2026: {0:'2026-07-31',1:'2026-07-31',2:'2026-07-31',3:'2026-08-31',4:'2026-08-31',5:'2026-08-31',6:'2026-09-30',7:'2026-09-30',8:'2026-09-30',9:'2026-09-30'}};
const prazoLic = (v, ano) => (LIC[ano] || {})[finalPlaca(v.placa)] || '';
const TIPO_NOME = {ipva:'IPVA', grt:'GRT', vistoria:'Vistoria GNV', reteste:'Reteste GNV', outro:'Outro'};
let aba = 'multas', anoRef = new Date().getFullYear(), dFiltro = 'todos', dBusca = '', dOrdem = 'nome', dAbertos = new Set(), dAnim = null;
try{ aba = localStorage.getItem('multas_aba') === 'debitos' ? 'debitos' : 'multas'; }catch(e){}
const semAc = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '');
const gCarro = v => GEST.idx ? (GEST.idx[normPlaca(v.placa)] || null) : null;
const ehGNV = g => !!g && (/gnv/i.test(semAc(g.combustivel)) || !!g.gnvExercicio || !!g.gnvRequalif);
const diasAte = iso => Math.round((new Date(iso + 'T12:00:00') - new Date(isoHoje() + 'T12:00:00')) / 864e5);
const debDoAno = (v, tipo) => (v.debitos || []).filter(d => +d.ano === anoRef && (!tipo || d.tipo === tipo));

/* Situação automática do ano, tirada do Gestão. CRLV do ano = IPVA e GRT do ano quitados (R$ 0). */
function situacao(v){
  const g = gCarro(v), Y = anoRef, out = [];
  const ex = g ? parseInt(g.exercicioCRLV, 10) || 0 : 0;
  ['ipva','grt'].forEach(tipo => {
    let st, det;
    if(!GEST.idx){ st = 'sem'; det = 'aguardando dados do Gestão'; }
    else if(!g){ st = 'sem'; det = 'placa não encontrada no Gestão'; }
    else if(ex >= Y){ st = 'ok'; det = `CRLV ${ex} — nada a pagar em ${Y}`; }
    else {
      st = 'pend'; det = ex ? `CRLV ${ex} — falta o de ${Y}` : 'CRLV sem exercício no Gestão';
      const pz = prazoLic(v, Y);
      if(pz) det += diasAte(pz) < 0 ? ` · prazo venceu em ${br(pz)} (final ${finalPlaca(v.placa)})` : ` · prazo ${br(pz)} (final ${finalPlaca(v.placa)})`;
    }
    out.push({tipo, st, det});
  });
  if(ehGNV(g)){
    const gx = parseInt(g.gnvExercicio, 10) || 0;
    out.push({tipo:'vistoria', st: gx >= Y ? 'ok' : gx ? 'pend' : 'sem', det: gx ? (gx >= Y ? `vistoria ${gx} em dia` : `última ${gx} — falta ${Y}`) : 'sem exercício no Gestão'});
    if(g.gnvRequalif){
      const d = diasAte(g.gnvRequalif);
      out.push({tipo:'reteste', st: d < 0 ? 'pend' : d <= 90 ? 'aviso' : 'ok', det: d < 0 ? `venceu em ${br(g.gnvRequalif)}` : `próximo em ${br(g.gnvRequalif)}` + (d <= 90 ? ` (${d} dias)` : '')});
    } else out.push({tipo:'reteste', st:'sem', det:'sem data no Gestão'});
  }
  // lançamentos do ano mandam no status da linha
  out.forEach(r => {
    const ls = debDoAno(v, r.tipo); r.ls = ls;
    if(ls.length){
      const tot = ls.reduce((s, d) => s + (d.valor || 0), 0), pagos = ls.filter(d => d.pagoEm).length;
      r.total = tot;
      if(pagos === ls.length){ r.st = 'ok'; r.det = `pago ${money(tot)}` + (ls.length > 1 ? ` (${ls.length} parcelas)` : ''); }
      else { r.st = 'pend'; r.det = `${money(ls.filter(d => !d.pagoEm).reduce((s, d) => s + (d.valor || 0), 0))} em aberto · ${pagos} de ${ls.length} pagos`; }
    }
  });
  return out;
}
/* Quanto o carro precisa para sair com o documento: IPVA + GRT (+ vistoria/outros do ano) + multas OBRIGATÓRIAS.
   CRLV atrasado → documento do ano atual; CRLV em dia → previsão do próximo. */
function paraDocumento(v){
  const g = gCarro(v), Y = new Date().getFullYear(), ex = g ? parseInt(g.exercicioCRLV, 10) || 0 : 0;
  const pend = !!g && ex < Y, T = g && ex >= Y ? Y + 1 : Y, itens = [];
  if(g){
    ['ipva', 'grt'].forEach(tp => {
      const ls = (v.debitos || []).filter(d => d.tipo === tp && +d.ano === T);
      const rot = TIPO_NOME[tp] + (tp === 'ipva' ? ' (estimado)' : '');
      if(ls.length){ const ab = ls.filter(d => !d.pagoEm); if(ab.length) itens.push({nome: rot, valor: ab.reduce((a, d) => a + (d.valor || 0), 0), sem: ab.some(d => d.valor == null)}); }
      else if(T > Y || pend){ const val = tp === 'grt' ? valorGRT(T) : ipvaEstimado(v, g, T).valor; itens.push({nome: rot + (T > Y ? ' — previsto' : ''), valor: val || 0, sem: val == null}); }
    });
    (v.debitos || []).filter(d => !d.pagoEm && +d.ano === T && d.tipo !== 'ipva' && d.tipo !== 'grt')
      .forEach(d => itens.push({nome: TIPO_NOME[d.tipo] || d.tipo, valor: d.valor || 0, sem: d.valor == null}));
  }
  const ob = v.multas.filter(m => m.obrig);
  if(ob.length) itens.push({nome: `Multas obrigatórias (${ob.length})`, valor: ob.reduce((a, m) => a + (m.valor || 0), 0), sem: ob.some(m => m.valor == null)});
  return {T, pend, itens, total: itens.reduce((a, i) => a + i.valor, 0), sem: itens.some(i => i.sem)};
}
function resumoMultas(v){
  const Y = String(new Date().getFullYear()), ab = v.multas, ob = ab.filter(m => m.obrig), pg = v.pagas.filter(m => (m.pagaEm || '').slice(0, 4) === Y);
  const soma = l => l.reduce((a, m) => a + (m.valor || 0), 0);
  return {n: ab.length, val: soma(ab), sem: ab.filter(m => m.valor == null).length, nOb: ob.length, valOb: soma(ob), nPg: pg.length, valPg: soma(pg), Y};
}
function resumoDeb(v){
  const sit = situacao(v);
  const aberto = (v.debitos || []).filter(d => !d.pagoEm).reduce((s, d) => s + (d.valor || 0), 0);
  const pend = sit.filter(r => r.st === 'pend').length + debDoAno(v, 'outro').filter(d => !d.pagoEm).length;

function historico(v){
  const it = [];
  (v.debitos || []).filter(d => d.pagoEm && d.valor).forEach(d => it.push({data: d.pagoEm, txt: `${TIPO_NOME[d.tipo] || d.tipo} ${d.ano}${d.obs && !/^(estimado|calculado|valor fixo)/.test(d.obs) ? ' · ' + d.obs : ''}`, valor: d.valor}));
  v.pagas.filter(m => m.pagaEm && m.valor).forEach(m => it.push({data: m.pagaEm, txt: `Multa de ${br(m.data)}`, valor: m.valor}));
  it.sort((a, b) => b.data.localeCompare(a.data));
  const anos = {};
  it.forEach(x => { const y = x.data.slice(0, 4); (anos[y] = anos[y] || []).push(x); });
  return anos;
}
function dLista(){
  let l = S.veiculos.slice();
  const q = dBusca.trim().toLowerCase();

  const f = {pend: v => resumoDeb(v).pend > 0, aberto: v => resumoDeb(v).aberto > 0, gnv: v => resumoDeb(v).gnv, ok: v => { const r = resumoDeb(v); return !r.pend && !r.aberto; }}[dFiltro];

function achaDeb(el){
  const card = el.closest('.car'), v = card && achar(card.dataset.id); if(!v) return {};
  const row = el.closest('[data-did]'), d = row ? (v.debitos || []).find(x => x.id === row.dataset.did) : null;
  return {card, v, d};
}
$('#dList').addEventListener('click', e => {
  const b = e.target.closest('[data-dact]'); if(!b) return;
  const act = b.dataset.dact; if(['valor','venc','pagoEm'].includes(act)) return;
  const {card, v, d} = achaDeb(b); if(!v) return;
  if(act === 'cp'){ if(b.dataset.v) copiar(b.dataset.v, 'Copiado: ' + b.dataset.v); return; }
  if(act === 'toggle'){ if(dAbertos.has(v.id)) dAbertos.delete(v.id); else { dAbertos.add(v.id); dAnim = v.id; } dRefresh(v); return; }
  if(act === 'quick'){
    const row = b.closest('.drow'), val = parseValor(row.querySelector('.dq-valor').value);
    if(val == null){ toast('Digite o valor'); row.querySelector('.dq-valor').focus(); return; }
    const tp = row.dataset.tipo;
    v.debitos.push({id: uid(), tipo: tp, ano: anoRef, valor: val, venc: tp === 'grt' ? prazoLic(v, anoRef) : '', pagoEm: '', obs: tp === 'ipva' && gCarro(v) ? ipvaEstimado(v, gCarro(v), anoRef).obs : '', ref: refAtual(gCarro(v), tp)});
    v.debitos.sort(cmpDeb); save(); dRefresh(v); renderDebStats(); renderSeg(); toast(`${TIPO_NOME[row.dataset.tipo]} ${anoRef} lançado`); return;
  }
  if(act === 'add'){
    const val = parseValor(card.querySelector('.da-valor').value), tipo = card.querySelector('.da-tipo').value;
    v.debitos.push({id: uid(), tipo, ano: anoRef, valor: val, venc: card.querySelector('.da-venc').value || (tipo === 'grt' ? prazoLic(v, anoRef) : ''), pagoEm: '', obs: card.querySelector('.da-obs').value.trim(), ref: refAtual(gCarro(v), tipo)});
    v.debitos.sort(cmpDeb); save(); dRefresh(v); renderDebStats(); renderSeg(); toast(`${TIPO_NOME[tipo]} ${anoRef} lançado`); return;
  }
  if(!d) return;
  if(act === 'pagar'){ d.pagoEm = isoHoje(); save(); dRefresh(v); renderDebStats(); renderSeg(); toast(`${TIPO_NOME[d.tipo]} marcado como pago`); }
  if(act === 'del'){ snap(); v.debitos = v.debitos.filter(x => x !== d); save(); dRefresh(v); renderDebStats(); renderSeg(); toast('Lançamento excluído', true); }
});
$('#dList').addEventListener('change', e => {
  const t = e.target, act = t.dataset.dact; if(!['valor','venc','pagoEm'].includes(act)) return;
  const {card, v, d} = achaDeb(t); if(!d) return;
  if(act === 'valor'){ d.valor = parseValor(t.value); t.value = num2(d.valor); t.closest('.mi').classList.toggle('vazio', d.valor == null); }
  else d[act] = t.value || '';
  save(); card.querySelector('.nums').outerHTML = dNumsHTML(v); renderDebStats(); renderSeg();
  if(act === 'pagoEm') { const row = t.closest('.dl'); row.classList.toggle('pago', !!d.pagoEm); }
});
$('#dList').addEventListener('focusout', () => setTimeout(() => { if(renderPendente && !digitandoEm('#dList') && !digitandoNaLista()){ renderPendente = false; render(); } }, 150));
$('#dList').addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  if(e.target.matches('.dq-valor')){ e.preventDefault(); e.target.closest('.drow').querySelector('[data-dact=quick]').click(); }
  else if(e.target.matches('.da-valor,.da-obs')){ e.preventDefault(); e.target.closest('.car').querySelector('[data-dact=add]').click(); }
});
$('#seg').addEventListener('click', e => {
  const b = e.target.closest('[data-aba]'); if(!b || b.dataset.aba === aba) return;
  aba = b.dataset.aba; try{ localStorage.setItem('multas_aba', aba); }catch(err){}
  window.scrollTo(0, 0); renderSeg(); renderDeb();
});
$('#dStats').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if(b){ dFiltro = b.dataset.f; renderDeb(); } });
$('#dFiltros').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if(b){ dFiltro = b.dataset.f; renderDeb(); } });
$('#dq').addEventListener('input', e => { dBusca = e.target.value; renderDeb(); });
$('#dAno').addEventListener('change', e => { anoRef = +e.target.value; renderDeb(); });
$('#dOrdem').addEventListener('change', e => { dOrdem = e.target.value; renderDeb(); });
/* iPhone: sem zoom de pinça nem de duplo toque */
['gesturestart','gesturechange','gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), {passive: false}));

(function iniciarNuvem(){
  if(!window.firebase){ setSync('off'); return; }
  try{ firebase.initializeApp(firebaseConfig); DB = firebase.database(); }catch(e){ setSync('err'); return; }
  let iniciou = false;
  firebase.auth().onAuthStateChanged(u => {
    if(!u || iniciou) return; iniciou = true;
    const k = chaveSalva();
    if(k) conectar(k); else pedirChave(true);
  });
  firebase.auth().signInAnonymously().catch(e => { setSync('err'); toast('Falha ao entrar na nuvem: ' + e.message); });
})();
/* Service worker próprio (escopo /multas/), offline e atualização automática */
if('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('sw.js', {scope: './', updateViaCache: 'none'}).catch(() => {});
}
/* Se a 1ª visita passou pelo service worker do Gestão, devolve ao Gestão a página dele no cache offline */
(async () => {
  try{
    if(!('caches' in window) || location.protocol !== 'https:') return;
    const url = new URL('../index.html', location.href).href;
    for(const k of (await caches.keys()).filter(k => k.startsWith('guimas-gestao-shell-v'))){
      const c = await caches.open(k), hit = await c.match(url);
      if(hit && (await hit.clone().text()).includes('content="guimas-multas"')){
        const r = await fetch(url, {cache: 'no-store'}); if(r.ok) await c.put(url, r);
      }
    }
  }catch(e){}
})();
</script>
<script>
/* v179 — teclado do iPhone. Com o teclado aberto: a barra de baixo some, e a janela/folha aberta
   passa a ocupar só a parte visível da tela (acima do teclado), sem "flutuar" nem travar. */
(function(){
 var vv=window.visualViewport,de=document.documentElement,foco=false,aberto=false,raf=0;
 function campo(el){return !!el&&(/^(TEXTAREA|SELECT)$/.test(el.tagName)||(el.tagName==='INPUT'&&!/^(checkbox|radio|file|button|submit|reset|range|color|hidden)$/i.test(el.type||'')))||!!(el&&el.isContentEditable)}
 function aplicar(){
  raf=0;
  var h=vv?vv.height:window.innerHeight,t=vv?Math.max(0,vv.offsetTop):0,kb=vv?Math.max(0,window.innerHeight-vv.height):0;
  var agora=foco&&(kb>120||!vv)||kb>150;
  de.style.setProperty('--vvh',Math.round(h)+'px');
  de.style.setProperty('--vvt',Math.round(t)+'px');
  if(agora!==aberto){
   aberto=agora;de.classList.toggle('teclado',agora);
   if(agora){var a=document.activeElement;if(campo(a)&&a.closest&&a.closest('dialog'))setTimeout(function(){try{a.scrollIntoView({block:'center'})}catch(e){}},60)}
   
  }
 }
 function agenda(){if(!raf)raf=(window.requestAnimationFrame||setTimeout)(aplicar)}
 if(vv){vv.addEventListener('resize',agenda);vv.addEventListener('scroll',agenda)}
 window.addEventListener('resize',agenda);
 document.addEventListener('focusin',function(e){if(campo(e.target)){foco=true;agenda();setTimeout(agenda,250)}},true);
 document.addEventListener('focusout',function(){setTimeout(function(){foco=campo(document.activeElement);agenda();setTimeout(agenda,300)},80)},true);
 aplicar();
})();
</script>
