name: teste-fipe
on: push
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          H='Origin: https://hudsonmesquitaconstantino-maker.github.io'
          for u in https://parallelum.com.br/fipe/api/v1/carros/marcas https://parallelum.com.br/fipe/api/v1/carros/marcas/21/modelos https://fipe.parallelum.com.br/api/v2/cars/brands https://brasilapi.com.br/api/fipe/marcas/v1/carros https://brasilapi.com.br/api/fipe/preco/v1/001505-0; do
            echo "=== $u"; curl -s -m 20 -D - -H "$H" "$u" -o body.txt | grep -iE "^HTTP|access-control-allow-origin"; head -c 250 body.txt; echo
          done
