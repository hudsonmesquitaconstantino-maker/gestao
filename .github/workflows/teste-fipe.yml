name: teste-fipe
on: push
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://hudsonmesquitaconstantino-maker.github.io/gestao
          curl -s $B/fipe/info.json; echo
          curl -s -o /dev/null -w "marcas %{http_code} %{size_download}\n" $B/fipe/marcas.json
          curl -s $B/fipe/marca/mx-fiat.json | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d["mes"],len(d["modelos"]),[m for m in d["modelos"] if m["nome"].startswith("MOBI LIKE 1.0")][0]["anos"][:3])'
          curl -s $B/fipe/cod/001.json | python3 -c 'import sys,json;print(json.load(sys.stdin)["001461-3"][:2])'
          curl -s $B/index.html | grep -o "var APP_VER=[0-9]*"
