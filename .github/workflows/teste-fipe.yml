name: teste-fipe
on: push
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://media.githubusercontent.com/media/fipex-labs/dataset/main/2026/11/fipex-prices.csv
          curl -sL -o f.csv -w "HTTP %{http_code} %{size_download}\n" $U
          head -3 f.csv
          python3 - <<'PY'
          import csv,collections
          r=list(csv.DictReader(open('f.csv',encoding='utf-8'),delimiter='\t'))
          print('linhas',len(r),'colunas',list(r[0].keys()))
          print('tipos',collections.Counter(x['tipo_veiculo'] for x in r))
          print('meses',collections.Counter((x['mes_referencia'],x['ano_referencia']) for x in r).most_common(3))
          c=[x for x in r if x['tipo_veiculo'] in('1','carro','Carro','carros')]
          print('carros',len(c),'marcas',len(set(x['nome_marca'] for x in c)),'codigos',len(set(x['codigo_fipe'] for x in c)))
          for x in c:
            if 'Mobi' in x['nome_modelo'] and x['ano_modelo'] in('2020','2025'): print(x); break
          for x in c:
            if 'Cronos' in x['nome_modelo'] and x['ano_modelo']=='2019': print(x); break
          PY
