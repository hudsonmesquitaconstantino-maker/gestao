name: teste-fipe
on: push
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://veiculos.fipe.org.br/api/veiculos
          A=(-s -m 25 -H 'Referer: https://veiculos.fipe.org.br/' -H 'Content-Type: application/x-www-form-urlencoded; charset=UTF-8' -H 'X-Requested-With: XMLHttpRequest' -H 'User-Agent: Mozilla/5.0')
          echo "== tabelas"; curl "${A[@]}" -w "\nHTTP %{http_code}\n" -X POST $B/ConsultarTabelaDeReferencia | head -c 300; echo
          T=$(curl "${A[@]}" -X POST $B/ConsultarTabelaDeReferencia | python3 -c 'import sys,json;print(json.load(sys.stdin)[0]["Codigo"])' 2>/dev/null); echo "tabela=$T"
          echo "== marcas"; curl "${A[@]}" -w "\nHTTP %{http_code}\n" -X POST $B/ConsultarMarcas -d "codigoTabelaReferencia=$T&codigoTipoVeiculo=1" | head -c 300; echo
          echo "== modelos fiat"; curl "${A[@]}" -w "\nHTTP %{http_code}\n" -X POST $B/ConsultarModelos -d "codigoTabelaReferencia=$T&codigoTipoVeiculo=1&codigoMarca=21" | head -c 300; echo
          T2=$(curl "${A[@]}" -X POST $B/ConsultarTabelaDeReferencia | python3 -c 'import sys,json;print(json.load(sys.stdin)[1]["Codigo"])' 2>/dev/null); echo "tabela anterior=$T2"
          echo "== marcas mes anterior"; curl "${A[@]}" -w "\nHTTP %{http_code}\n" -X POST $B/ConsultarMarcas -d "codigoTabelaReferencia=$T2&codigoTipoVeiculo=1" | head -c 200; echo
