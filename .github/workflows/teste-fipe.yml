name: teste-fipe
on: push
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "=== fipex releases"; curl -s https://api.github.com/repos/fipex-labs/dataset/releases?per_page=3 | python3 -c 'import sys,json;[print(r["tag_name"],r["published_at"],[(a["name"],a["size"]//1048576) for a in r["assets"]]) for r in json.load(sys.stdin)]'
          echo "=== fipex 2026"; curl -s https://api.github.com/repos/fipex-labs/dataset/contents/2026 | python3 -c 'import sys,json;print([x["name"] for x in json.load(sys.stdin)])'
          echo "=== fipex commits"; curl -s "https://api.github.com/repos/fipex-labs/dataset/commits?per_page=3" | python3 -c 'import sys,json;[print(c["commit"]["committer"]["date"],c["commit"]["message"][:80]) for c in json.load(sys.stdin)]'
          for m in 11 10 09; do echo "=== fipex 2026/$m"; curl -s "https://api.github.com/repos/fipex-labs/dataset/contents/2026/$m" | python3 -c 'import sys,json;d=json.load(sys.stdin);print([(x["name"],x["size"]//1024,x.get("download_url")) for x in d] if isinstance(d,list) else d.get("message"))'; done
          echo "=== caique releases"; curl -s https://api.github.com/repos/CaiqueDourado/fipe-ficha-tecnica-veiculos/releases?per_page=2 | python3 -c 'import sys,json;[print(r["tag_name"],r["published_at"],[(a["name"],a["size"]//1048576) for a in r["assets"]]) for r in json.load(sys.stdin)]'
          echo "=== fipe.org home"; curl -s -m 20 -A 'Mozilla/5.0' -o h.html -w "%{http_code}\n" https://veiculos.fipe.org.br/; grep -o "<title>[^<]*" h.html | head -2
          echo "=== fipe.org api"; curl -s -m 20 -A 'Mozilla/5.0' -H 'Referer: https://veiculos.fipe.org.br/' -X POST -o a.html -w "%{http_code}\n" https://veiculos.fipe.org.br/api/veiculos/ConsultarTabelaDeReferencia; head -c 200 a.html; echo; grep -o "<title>[^<]*" a.html | head -2
          echo "=== parallelum v2 refs"; curl -s -m 20 https://fipe.parallelum.com.br/api/v2/references | head -c 200; echo
          echo "=== parallelum v2 price by code"; curl -s -m 20 "https://fipe.parallelum.com.br/api/v2/cars/001505-0/years/2020-1/history" | head -c 200; echo
